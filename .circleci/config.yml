version: 2.1

jobs:
  build_sonar:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install SonarScanner for MSBuild
          command: |
            dotnet tool install --global dotnet-sonarscanner || true
            export PATH="$PATH:$HOME/.dotnet/tools"
      - run:
          name: Sonar begin (if configured)
          command: |
            if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
              dotnet sonarscanner begin /k:"CustomerPortal" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.login="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
            else
              echo "SONAR_HOST_URL or SONAR_TOKEN not set; skipping SonarScanner begin"
            fi
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run:
          name: Run tests and collect coverage
          command: |
            dotnet test --no-build -c Release --logger "trx" /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=TestResults/coverage.opencover.xml
      - run:
          name: Sonar end (if configured)
          command: |
            if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
              dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
            else
              echo "SONAR_HOST_URL or SONAR_TOKEN not set; skipping SonarScanner end"
            fi
      - run: dotnet publish -c Release -o publish
      - run:
          name: Check for vulnerable NuGet packages
          command: |
            echo "Checking for vulnerable packages..."
            dotnet list package --vulnerable || true
      - persist_to_workspace:
          root: .
          paths:
            - publish
            - TestResults
workflows:
  version: 2
  scan_and_test:
    jobs:
      - build_sonar
