version: 2.1

jobs:
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
      - image: mcr.microsoft.com/mssql/server:2022-latest
        name: mssql
        environment:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "${SA_PASSWORD}"
    working_directory: ~/repo
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-nuget-{{ checksum "CustomerPortal.sln" }}
            - v1-nuget-

      - run:
          name: Restore
          command: dotnet restore CustomerPortal.sln

      - run:
          name: Build
          command: dotnet build CustomerPortal.sln --configuration Release --no-restore

      - run:
          name: Wait for SQL Server
          command: |
            echo "Waiting for mssql on port 1433..."
            for i in $(seq 1 30); do
              (echo > /dev/tcp/mssql/1433) >/dev/null 2>&1 && { echo "mssql reachable"; break; }
              echo -n .
              sleep 2
            done

      - run:
          name: Run integration tests
          command: |
            export SA_PASSWORD=${SA_PASSWORD}
            export ConnectionStrings__DefaultConnection="Server=mssql,1433;Initial Catalog=CustomerPortalTest;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
            dotnet test CustomerPortal.IntegrationTests/CustomerPortal.IntegrationTests.csproj --no-build --verbosity minimal

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: v1-nuget-{{ checksum "CustomerPortal.sln" }}

workflows:
  version: 2
  build-and-test-workflow:
    jobs:
      - build-and-test