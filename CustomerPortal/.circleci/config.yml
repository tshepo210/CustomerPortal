version: 2.1

jobs:
  build-sonar:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/repo/CustomerPortal
    steps:
      - checkout
      - run:
          name: Install SonarScanner for MSBuild
          command: |
            dotnet tool install --global dotnet-sonarscanner || true
            export PATH="$PATH:$HOME/.dotnet/tools"
      - run:
          name: Sonar begin (if configured)
          command: |
            if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
              dotnet sonarscanner begin /k:"CustomerPortal" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.login="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
            else
              echo "SONAR_HOST_URL or SONAR_TOKEN not set; skipping SonarScanner begin"
            fi
      - run: dotnet restore CustomerPortal.csproj
      - run: dotnet build CustomerPortal.csproj --no-restore -c Release
      - run:
          name: Run tests and collect coverage
          command: |
            dotnet test ../CustomerPortal.IntegrationTests/CustomerPortal.IntegrationTests.csproj --no-build -c Release --logger "trx" /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=TestResults/coverage.opencover.xml
      - run:
          name: Sonar end (if configured)
          command: |
            if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
              dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
            else
              echo "SONAR_HOST_URL or SONAR_TOKEN not set; skipping SonarScanner end"
            fi
      - run: dotnet publish -c Release -o publish
      - run:
          name: Check for vulnerable NuGet packages
          command: |
            echo "Checking for vulnerable packages..."
            dotnet list package --vulnerable || true
      - persist_to_workspace:
          root: .
          paths:
            - publish
            - TestResults
  build-and-test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
      - image: mcr.microsoft.com/mssql/server:2022-latest
        name: mssql
        environment:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "<< pipeline | SA_PASSWORD >>" # set in CircleCI project settings
    working_directory: ~/repo/CustomerPortal
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-nuget-{{ checksum "CustomerPortal.sln" }}
            - v1-nuget-

      - run:
          name: Restore
          command: dotnet restore CustomerPortal.sln

      - run:
          name: Build
          command: dotnet build CustomerPortal.sln --configuration Release --no-restore

      - run:
          name: Wait for SQL Server
          command: |
            echo "Waiting for mssql on port 1433..."
            for i in $(seq 1 30); do
              (echo > /dev/tcp/mssql/1433) >/dev/null 2>&1 && { echo "mssql reachable"; break; }
              echo -n .
              sleep 2
            done

      - run:
          name: Run unit tests
          command: dotnet test CustomerPortal.sln --no-build --filter TestCategory!=Integration --verbosity minimal

      - run:
          name: Run integration tests
          command: |
            export SA_PASSWORD=${SA_PASSWORD}
            export ConnectionStrings__DefaultConnection="Server=mssql,1433;Initial Catalog=CustomerPortalTest;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
            dotnet test ../CustomerPortal.IntegrationTests/CustomerPortal.IntegrationTests.csproj --no-build --verbosity minimal

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: v1-nuget-{{ checksum "CustomerPortal.sln" }}
workflows:
  version: 2
  build-and-test-workflow:
    jobs:
      - build-sonar
      - build-and-test
